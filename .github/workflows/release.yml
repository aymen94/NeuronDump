name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries need the build machine's glibc version or newer, so
          # building on 22.04 (glibc 2.35) keeps the binary working on older distros.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # Intel build is cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p neurondump --features trace

      - name: Package
        shell: bash
        run: |
          NAME=neurondump-${{ matrix.target }}
          # macOS runners have shasum but not sha256sum.
          sha() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          mkdir "$NAME"
          cp README.md LICENSE "$NAME"/
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp target/${{ matrix.target }}/release/neurondump.exe "$NAME"/
            7z a "$NAME.zip" "$NAME"
            sha "$NAME.zip" > "$NAME.zip.sha256"
          else
            cp target/${{ matrix.target }}/release/neurondump "$NAME"/
            tar czf "$NAME.tar.gz" "$NAME"
            sha "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            neurondump-*.zip
            neurondump-*.tar.gz
            neurondump-*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: neurondump-*
          generate_release_notes: true
