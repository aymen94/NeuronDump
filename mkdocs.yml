site_name: NeuronDump
site_description: Inspect, analyze and slim GGUF language models (Ollama, llama.cpp).
site_url: https://aymen94.github.io/NeuronDump/
repo_url: https://github.com/aymen94/NeuronDump
repo_name: aymen94/NeuronDump
edit_uri: edit/main/docs/
copyright: Licensed under the MIT License

nav:
  - Home: index.md
  - Browser demo: https://aymen94.github.io/NeuronDump/demo/
  - How it works: how-it-works.md
  - Guide:
      - Install and run: install.md
      - Getting started: getting-started.md
      - Analyze and slim: analyze-and-slim.md
      - Trace: trace.md
      - Graph and ablation: graph-and-ablation.md
      - 3D graph: 3d-graph.md
      - Interventions and edits: interventions.md
      - Web interface: web-ui.md
  - Reference:
      - CLI reference: cli.md
      - HTTP API: api.md
      - Architecture: architecture.md
      - Internals: internals.md
      - Limitations: limitations.md
      - Building: building.md
  - Research:
      - What's inside real models: models.md

theme:
  name: material
  font: false            # system fonts, no Google Fonts request
  palette:
    # default: follow the operating system
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

exclude_docs: |
  requirements.txt
